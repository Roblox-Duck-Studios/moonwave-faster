name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset names include both OS and arch so Rokit (and the npm CLI)
          # can pick the right binary, e.g. moonwave-extractor-v1.4.3-linux-x86_64.zip
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
          - label: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - label: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        working-directory: ./extractor
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Get asset name
        shell: bash
        run: |
          echo "ASSET_NAME=moonwave-extractor-${GITHUB_REF_NAME}-${{ matrix.label }}" >> "$GITHUB_ENV"

      - name: Zip binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: extractor/target/${{ matrix.target }}/release
        run: Compress-Archive moonwave-extractor.exe "$env:GITHUB_WORKSPACE/$env:ASSET_NAME.zip"

      - name: Zip binary (macOS / Linux)
        if: runner.os != 'Windows'
        working-directory: extractor/target/${{ matrix.target }}/release
        run: zip "$GITHUB_WORKSPACE/$ASSET_NAME.zip" moonwave-extractor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Not a prerelease: Rokit installs from the repo's "latest" release,
      # which GitHub never points at a prerelease.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Moonwave $GITHUB_REF_NAME" \
            --generate-notes
